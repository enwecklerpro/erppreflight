# promtool unit tests for alerts.yml:
#   docker run --rm -v "$PWD/infra/observability/prometheus:/r:ro" --entrypoint promtool \
#     prom/prometheus:v3.15.0 test rules /r/alerts.test.yml
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # --- API down, and a healthy API with Redis missing ------------------------------------
  - interval: 1m
    input_series:
      - series: 'up{job="erppreflight-api", instance="erppreflight-api:3001"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 1m
        alertname: ErpPreflightApiDown
        exp_alerts: []
      - eval_time: 3m
        alertname: ErpPreflightApiDown
        exp_alerts:
          - exp_labels: { severity: critical, service: api, job: erppreflight-api, instance: "erppreflight-api:3001" }
            exp_annotations:
              summary: "ERP Preflight API metrics endpoint unreachable (erppreflight-api:3001)"
              description: "Prometheus could not scrape /api/v1/metrics for 2 minutes. The API container is down, restarting, or METRICS_TOKEN no longer matches (401/404 also count as a failed scrape)."
              runbook_url: "https://github.com/enwecklerpro/erppreflight/blob/main/docs/runbooks/observability.md#erppreflightapidown"
      - eval_time: 3m
        alertname: ErpPreflightRedisMetricsMissing
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'up{job="erppreflight-api", instance="erppreflight-api:3001"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 7m
        alertname: ErpPreflightRedisMetricsMissing
        exp_alerts:
          - exp_labels: { severity: critical, service: redis }
            exp_annotations:
              summary: "API is up but reports no analysis queue metrics (Redis unreachable)"
              description: "The API omits erppreflight_queue_jobs when BullMQ cannot reach Redis. Analyses cannot be queued or processed."
              runbook_url: "https://github.com/enwecklerpro/erppreflight/blob/main/docs/runbooks/QUEUE_BACKLOG.md"

  - interval: 1m
    input_series:
      - series: 'up{job="erppreflight-api", instance="erppreflight-api:3001"}'
        values: '1x10'
      - series: 'erppreflight_queue_jobs{job="erppreflight-api", queue="analysis-queue", state="waiting"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 7m
        alertname: ErpPreflightRedisMetricsMissing
        exp_alerts: []

  # --- restarts ---------------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'process_uptime_seconds{job="erppreflight-api", instance="erppreflight-api:3001"}'
        values: '60 120 10 70 10 70 10 70'
    alert_rule_test:
      - eval_time: 7m
        alertname: ErpPreflightApiRestarting
        exp_alerts:
          - exp_labels: { severity: critical, service: api, job: erppreflight-api, instance: "erppreflight-api:3001" }
            exp_annotations:
              summary: "ERP Preflight API restarted 3 times in 30 minutes"
              description: "The API process is crash-looping (OOM kill, failed dependency at boot, or unhandled error). Check `docker logs erppreflight-api` and whether the container was OOM-killed (`docker inspect erppreflight-api`, field State.OOMKilled)."
              runbook_url: "https://github.com/enwecklerpro/erppreflight/blob/main/docs/runbooks/observability.md#erppreflightapirestarting"

  # --- 5xx ratio: 10 % fires, 1 % does not ------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'erppreflight_http_requests_total{job="erppreflight-api", method="GET", status="200"}'
        values: '0+54x30'
      - series: 'erppreflight_http_requests_total{job="erppreflight-api", method="POST", status="503"}'
        values: '0+6x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: ErpPreflightHigh5xxRate
        exp_alerts:
          - exp_labels: { severity: critical, service: api }
            exp_annotations:
              summary: "API 5xx ratio 10% over 10 minutes"
              description: "More than 2 % of API responses are server errors. Correlate with Sentry (SENTRY_DSN) and the request logs by X-Request-Id."
              runbook_url: "https://github.com/enwecklerpro/erppreflight/blob/main/docs/runbooks/observability.md#erppreflighthigh5xxrate"
  - interval: 1m
    input_series:
      - series: 'erppreflight_http_requests_total{job="erppreflight-api", method="GET", status="200"}'
        values: '0+594x30'
      - series: 'erppreflight_http_requests_total{job="erppreflight-api", method="POST", status="503"}'
        values: '0+6x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: ErpPreflightHigh5xxRate
        exp_alerts: []

  # --- latency ----------------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'erppreflight_http_request_duration_seconds_bucket{job="erppreflight-api", method="GET", status_class="2xx", le="1"}'
        values: '0+1x30'
      - series: 'erppreflight_http_request_duration_seconds_bucket{job="erppreflight-api", method="GET", status_class="2xx", le="2.5"}'
        values: '0+2x30'
      - series: 'erppreflight_http_request_duration_seconds_bucket{job="erppreflight-api", method="GET", status_class="2xx", le="5"}'
        values: '0+20x30'
      - series: 'erppreflight_http_request_duration_seconds_bucket{job="erppreflight-api", method="GET", status_class="2xx", le="+Inf"}'
        values: '0+20x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: ErpPreflightHighLatencyP95
        exp_alerts:
          - exp_labels: { severity: warning, service: api }
            exp_annotations:
              summary: "API p95 latency 4.861s over 15 minutes"
              description: "The 95th percentile of all API requests is above 2.5 s. Check the DB pool (erppreflight_db_pool_connections), host CPU/memory and slow traces."
              runbook_url: "https://github.com/enwecklerpro/erppreflight/blob/main/docs/runbooks/observability.md#erppreflighthighlatencyp95"

  # --- queue backlog + failed jobs --------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'erppreflight_queue_jobs{job="erppreflight-api", queue="analysis-queue", state="waiting"}'
        values: '1+1x30'
      - series: 'erppreflight_queue_jobs{job="erppreflight-api", queue="analysis-queue", state="failed"}'
        values: '4x10 6x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: ErpPreflightAnalysisQueueBacklog
        exp_alerts:
          - exp_labels: { severity: warning, service: worker, job: erppreflight-api, queue: analysis-queue, state: waiting }
            exp_annotations:
              summary: "Analysis queue backlog growing (21 waiting)"
              description: "Waiting analysis jobs have not drained for 15 minutes and keep growing. The worker in the API container may be stuck or the analysis service slow/unavailable."
              runbook_url: "https://github.com/enwecklerpro/erppreflight/blob/main/docs/runbooks/QUEUE_BACKLOG.md"
      - eval_time: 25m
        alertname: ErpPreflightAnalysisJobsFailing
        exp_alerts: []
      - eval_time: 35m
        alertname: ErpPreflightAnalysisJobsFailing
        exp_alerts:
          - exp_labels: { severity: warning, service: worker, job: erppreflight-api, queue: analysis-queue, state: failed }
            exp_annotations:
              summary: "2 analysis job(s) failed after all retries in the last 30 minutes"
              description: "BullMQ moved jobs to the failed set (3 attempts exhausted). Inspect failedReason in Redis."
              runbook_url: "https://github.com/enwecklerpro/erppreflight/blob/main/docs/runbooks/QUEUE_BACKLOG.md"
  - interval: 1m
    input_series:
      - series: 'erppreflight_queue_jobs{job="erppreflight-api", queue="analysis-queue", state="waiting"}'
        values: '3 0 3 0 3 0 3 0 3 0 3 0 3 0 3 0 3 0 3 0 3'
    alert_rule_test:
      - eval_time: 20m
        alertname: ErpPreflightAnalysisQueueBacklog
        exp_alerts: []

  # --- engine failure ratio (needs volume) -------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'erppreflight_engine_runs_total{job="erppreflight-api", engine="OPD_GUARD", outcome="COMPLETED"}'
        values: '0+1x60'
      - series: 'erppreflight_engine_runs_total{job="erppreflight-api", engine="FORM_DOCTOR", outcome="FAILED"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 50m
        alertname: ErpPreflightEngineFailureRatio
        exp_alerts:
          - exp_labels: { severity: warning, service: analysis-python }
            exp_annotations:
              summary: "50% of engine runs FAILED in 30 minutes"
              description: "FAILED includes rejected input (INSUFFICIENT_INPUT / PARSE_ERROR), so a single customer uploading wrong files can trigger this; a ratio across many runs points at the analysis service. Break down by engine in the Grafana dashboard."
              runbook_url: "https://github.com/enwecklerpro/erppreflight/blob/main/docs/runbooks/observability.md#erppreflightenginefailureratio"
  - interval: 1m
    input_series:
      - series: 'erppreflight_engine_runs_total{job="erppreflight-api", engine="FORM_DOCTOR", outcome="FAILED"}'
        values: '0 1 2 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3 3'
    alert_rule_test:
      - eval_time: 30m
        alertname: ErpPreflightEngineFailureRatio
        exp_alerts: []

  # --- platform gauges ---------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'erppreflight_db_pool_connections{job="erppreflight-api", state="waiting"}'
        values: '2x10'
      - series: 'erppreflight_outbox_queue_lag{job="erppreflight-api"}'
        values: '150x20'
      - series: 'process_resident_memory_bytes{job="erppreflight-api"}'
        values: '1800000000x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: ErpPreflightDbPoolSaturated
        exp_alerts:
          - exp_labels: { severity: warning, service: postgres }
            exp_annotations:
              summary: "Requests waiting for a PostgreSQL connection for 5 minutes"
              description: "The pg pool has had waiting clients continuously. Look for long-running queries (pg_stat_activity) and lock contention."
              runbook_url: "https://github.com/enwecklerpro/erppreflight/blob/main/docs/runbooks/observability.md#erppreflightdbpoolsaturated"
      - eval_time: 16m
        alertname: ErpPreflightOutboxLag
        exp_alerts:
          - exp_labels: { severity: warning, service: api }
            exp_annotations:
              summary: "150 domain events pending in the outbox for 15 minutes"
              description: "Notifications and webhooks are not being dispatched."
              runbook_url: "https://github.com/enwecklerpro/erppreflight/blob/main/docs/runbooks/observability.md#erppreflightoutboxlag"
      - eval_time: 16m
        alertname: ErpPreflightProcessMemoryHigh
        exp_alerts:
          - exp_labels: { severity: warning, service: api }
            exp_annotations:
              summary: "API resident memory 1.676GiB (container limit 2 GiB)"
              description: "The API is close to its compose memory limit and will be OOM-killed."
              runbook_url: "https://github.com/enwecklerpro/erppreflight/blob/main/docs/runbooks/observability.md#erppreflightprocessmemoryhigh"

  # --- ingestion + integrations -------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'erppreflight_upload_rejections{job="erppreflight-api"}'
        values: '0x30 15x40'
      - series: 'erppreflight_webhook_deliveries_by_status{job="erppreflight-api", status="DEAD"}'
        values: '1x10 3x30'
      - series: 'erppreflight_connectors_by_health{job="erppreflight-api", health="UNHEALTHY"}'
        values: '1x70'
    alert_rule_test:
      - eval_time: 25m
        alertname: ErpPreflightUploadRejectionSpike
        exp_alerts: []
      - eval_time: 65m
        alertname: ErpPreflightUploadRejectionSpike
        exp_alerts:
          - exp_labels: { severity: warning, service: ingestion, job: erppreflight-api }
            exp_annotations:
              summary: "15 uploads rejected or quarantined in the last hour"
              description: "A burst of REJECTED/QUARANTINED uploads: malware attempts, a broken client, or an antivirus problem."
              runbook_url: "https://github.com/enwecklerpro/erppreflight/blob/main/docs/runbooks/CLAMAV_DOWN.md"
      - eval_time: 35m
        alertname: ErpPreflightWebhookDeliveriesDead
        exp_alerts:
          - exp_labels: { severity: warning, service: integrations, job: erppreflight-api, status: DEAD }
            exp_annotations:
              summary: "2 webhook deliveries exhausted all retries in 30 minutes"
              description: "Receivers stopped accepting deliveries. Tenants can replay them from /integrations?tab=webhooks once the receiver is fixed."
              runbook_url: "https://github.com/enwecklerpro/erppreflight/blob/main/docs/runbooks/observability.md#erppreflightwebhookdeliveriesdead"
      - eval_time: 35m
        alertname: ErpPreflightConnectorsUnhealthy
        exp_alerts:
          - exp_labels: { severity: info, service: integrations }
            exp_annotations:
              summary: "1 active connector(s) UNHEALTHY for 30 minutes"
              description: "Circuit breaker open or credentials invalid. Usually a tenant-side configuration issue; escalate only if many connectors of one type fail at once."
              runbook_url: "https://github.com/enwecklerpro/erppreflight/blob/main/docs/runbooks/observability.md#erppreflightconnectorsunhealthy"
