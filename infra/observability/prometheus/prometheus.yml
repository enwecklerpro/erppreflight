# ERP Preflight — Prometheus configuration for the opt-in observability profile
# (infra/observability/docker-compose.observability.yml). Scrapes the API's Prometheus endpoint
# inside the Docker network `erppreflight-network` and evaluates alerts.yml.
#
# The scrape token is METRICS_TOKEN of the API; the compose entrypoint writes it to
# /prometheus/metrics_token (never into this file). Without a token the endpoint answers 404
# and ErpPreflightApiDown fires.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    deployment: erppreflight-production

rule_files:
  - /etc/prometheus/rules/alerts.yml

# Route alerts by adding an Alertmanager (or use Grafana alerting on the same rules):
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: erppreflight-api
    metrics_path: /api/v1/metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /prometheus/metrics_token
    static_configs:
      - targets: ["erppreflight-api:3001"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
