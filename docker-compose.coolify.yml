# ==============================================================================
# ERP Preflight — Production Coolify / Hostinger Docker Compose Orchestration
# ==============================================================================
# Target Domain: erppreflight.com / api.erppreflight.com
# Compatible with Coolify v4+, Hostinger VPS (Ubuntu 22.04 / 24.04 LTS), Traefik
# Topology Matrix:
#   - web:              Port 3000 (Next.js 15 App Router Frontend)
#   - api:              Port 3001 (NestJS 11 Core SaaS API Backend)
#   - analysis-python:  Port 8000 (Python 3.13 FastAPI Stateless Microservice)
#   - postgres:         Port 5432 (PostgreSQL 16 + pgvector)
#   - redis:            Port 6379 (Redis 7.2 Alpine)
#   - minio:            Port 9000 (S3 API), 9001 (Console)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 with pgvector extension & RLS
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    container_name: erppreflight-postgres
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erppreflight}
      POSTGRES_USER: ${POSTGRES_USER:-erppreflight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      erppreflight-net:
        aliases:
          - erppreflight-postgres
          - postgres

  # ----------------------------------------------------------------------------
  # Redis 7 (Cache, Distributed Locks & BullMQ Job Queues)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2.16-alpine3.21@sha256:29e8589c3f9ba699b5f7aa4b3c7733c58852a3626439e619aa0ee78de08c6ca0
    container_name: erppreflight-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1 --loglevel warning
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      erppreflight-net:
        aliases:
          - erppreflight-redis
          - redis

  # ----------------------------------------------------------------------------
  # MinIO S3-Compatible Object Store (Quarantine, Clean & Reports Buckets)
  # ----------------------------------------------------------------------------
  minio:
    # elestio/minio publishes only `latest`; the digest pins MinIO RELEASE.2025-09-07T16-13-09Z
    # (image label "version"). Update the digest deliberately (Renovate: dashboard approval).
    image: elestio/minio:latest@sha256:25348a257f1ece1b192f25f6cd9854618fa86422ac87b494b5d4e629c556d4bd
    container_name: erppreflight-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    expose:
      - "9000"
      - "9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      erppreflight-net:
        aliases:
          - erppreflight-minio
          - minio

  # ----------------------------------------------------------------------------
  # ClamAV Antivirus Scanner (Ingestion Quarantine & Clean Verification)
  # ----------------------------------------------------------------------------
  clamav:
    image: clamav/clamav:1.5.4@sha256:0e31ce089574268aefa0b543767d66b70240ab51ed49eec53e07f18d5629d817
    container_name: erppreflight-clamav
    restart: unless-stopped
    expose:
      - "3310"
    volumes:
      # Persist signature databases so freshclam does not re-download on every restart
      - clamav_db:/var/lib/clamav
    healthcheck:
      # Image-provided probe: sends PING to clamd on 3310 and expects PONG
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          # clamd holds two signature DB copies in memory during reloads
          # (ConcurrentDatabaseReload defaults to yes): ~1.5 GB each.
          memory: 3072M
        reservations:
          cpus: '0.25'
          memory: 512M
    networks:
      erppreflight-net:
        aliases:
          - erppreflight-clamav
          - clamav

  # ----------------------------------------------------------------------------
  # Python 3.13 FastAPI Stateless Analysis Microservice (18 SAP Engines + MFS)
  # ----------------------------------------------------------------------------
  analysis-python:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.analysis
    container_name: erppreflight-analysis
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      PORT: 8000
      PYTHONUNBUFFERED: 1
      SERVICE_VERSION: "1.0.0"
      CORS_ORIGINS: "http://api:3001,http://web:3000,http://localhost:3001,http://localhost:3000,https://erppreflight.com,https://www.erppreflight.com,https://api.erppreflight.com,http://erppreflight.com,http://api.erppreflight.com"
      # Opt-in tracing (no-op when empty)
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: erppreflight-analysis
      # Streaming transport for multi-GB delimited logs (spooled to disk, bounded memory)
      MAX_STREAM_SIZE_MB: ${MAX_STREAM_SIZE_MB:-20480}
      STREAM_SPOOL_DIR: ${STREAM_SPOOL_DIR:-}
      # Disk-exhaustion guards: concurrent spools, free-space reserve of the spool volume
      MAX_CONCURRENT_STREAMS: ${MAX_CONCURRENT_STREAMS:-2}
      STREAM_MIN_FREE_DISK_MB: ${STREAM_MIN_FREE_DISK_MB:-1024}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      erppreflight-net:
        aliases:
          - erppreflight-analysis
          - analysis-python

  # ----------------------------------------------------------------------------
  # One-shot deployment jobs: pre-migration backup -> schema migration -> API
  #   postgres (healthy) -> db-backup (exit 0) -> migrate (exit 0) -> api
  # Both containers exit after their work; "Exited (0)" is their success state
  # (Coolify may list them as exited — see DEPLOYMENT_GUIDE.md §6a). A failed backup or
  # migration keeps the previous API container running and the new one from starting.
  # ----------------------------------------------------------------------------
  db-backup:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.db-backup
    container_name: erppreflight-db-backup
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: erppreflight-postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-erppreflight}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:-erppreflight}
      # auto = dump only when this release ships pending migrations; always; off (not recommended)
      PREMIGRATION_BACKUP: ${PREMIGRATION_BACKUP:-auto}
      PREMIGRATION_BACKUP_KEEP: ${PREMIGRATION_BACKUP_KEEP:-10}
    volumes:
      - premigration_backups:/backups
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - erppreflight-net

  migrate:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: erppreflight-migrate
    restart: "no"
    command: ["migrate"]
    # The image HEALTHCHECK probes the HTTP server, which this job never starts.
    healthcheck:
      disable: true
    depends_on:
      db-backup:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      MIGRATIONS_DIR: /app/packages/database/migrations
      DATABASE_URL: postgres://${POSTGRES_USER:-erppreflight}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@erppreflight-postgres:5432/${POSTGRES_DB:-erppreflight}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - erppreflight-net

  # ----------------------------------------------------------------------------
  # NestJS 11 Core API SaaS Backend (Auth, Ingestion, Tenancy, BullMQ, Reports)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: erppreflight-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      analysis-python:
        condition: service_healthy
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      API_PORT: 3001
      # Migrations run in the one-shot `migrate` service above (after the `db-backup`
      # pre-migration backup). AUTO_MIGRATE=true is the fallback: the API container then also
      # applies pending migrations at start (idempotent; no automatic backup on that path).
      AUTO_MIGRATE: ${AUTO_MIGRATE:-false}
      STRICT_MIGRATIONS: ${STRICT_MIGRATIONS:-true}
      MIGRATIONS_DIR: /app/packages/database/migrations
      DATABASE_URL: postgres://${POSTGRES_USER:-erppreflight}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@erppreflight-postgres:5432/${POSTGRES_DB:-erppreflight}
      # Optional dedicated runtime login (non-superuser, member of erppreflight_app); empty = reuse DATABASE_URL
      APP_DATABASE_URL: ${APP_DATABASE_URL:-}
      # Tenant-scoped transactions SET LOCAL ROLE to this NOBYPASSRLS role so RLS is enforced
      DB_RUNTIME_ROLE: ${DB_RUNTIME_ROLE:-erppreflight_app}
      REDIS_URL: redis://erppreflight-redis:6379
      REDIS_HOST: erppreflight-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Shared (Redis) rate limits; see .env.coolify.example
      RATE_LIMIT_REDIS_FAILURE_MODE: ${RATE_LIMIT_REDIS_FAILURE_MODE:-memory}
      RATE_LIMIT_KEY_PREFIX: ${RATE_LIMIT_KEY_PREFIX:-erppreflight:}
      ANALYSIS_SERVICE_URL: http://erppreflight-analysis:8000
      ANALYSIS_STREAM_THRESHOLD_MB: ${ANALYSIS_STREAM_THRESHOLD_MB:-8}
      S3_ENDPOINT: http://erppreflight-minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET_QUARANTINE: ${S3_BUCKET_QUARANTINE:-erppreflight-quarantine}
      S3_BUCKET_CLEAN: ${S3_BUCKET_CLEAN:-erppreflight-clean}
      S3_BUCKET_REPORTS: ${S3_BUCKET_REPORTS:-erppreflight-reports}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://erppreflight.com,https://www.erppreflight.com}
      # Browser session cookie (HttpOnly) + CSRF cookie attributes; see .env.coolify.example
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_MOCK_MODE: ${CLAMAV_MOCK_MODE:-false}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:?MASTER_ENCRYPTION_KEY is required}
      # One-time SUPER_ADMIN bootstrap (created only if the email does not exist; never reset)
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      # Prometheus scrape token for GET /api/v1/metrics (endpoint disabled when empty)
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      # Observability & enterprise integrations (see .env.coolify.example / docs/runbooks/observability.md)
      ENABLE_API_REFERENCE: ${ENABLE_API_REFERENCE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-erppreflight-api}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-}
      SSO_REDIRECT_BASE_URL: ${SSO_REDIRECT_BASE_URL:-}
      SSO_DNS_SERVERS: ${SSO_DNS_SERVERS:-}
      MASTER_ENCRYPTION_KEY_PREVIOUS: ${MASTER_ENCRYPTION_KEY_PREVIOUS:-}
      CONNECTOR_ALLOW_PRIVATE_NETWORKS: ${CONNECTOR_ALLOW_PRIVATE_NETWORKS:-false}
      WEBHOOK_ALLOW_PRIVATE_NETWORKS: ${WEBHOOK_ALLOW_PRIVATE_NETWORKS:-false}
      SSO_ALLOW_PRIVATE_NETWORKS: ${SSO_ALLOW_PRIVATE_NETWORKS:-false}
      AGENT_JOB_SIGNING_KEY: ${AGENT_JOB_SIGNING_KEY:-}
      AGENT_UPDATE_MANIFEST_STABLE: ${AGENT_UPDATE_MANIFEST_STABLE:-}
      AGENT_UPDATE_MANIFEST_BETA: ${AGENT_UPDATE_MANIFEST_BETA:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # E-mail delivery & account lifecycle (see .env.coolify.example)
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:?MAIL_TRANSPORT is required (smtp | http | dev)}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is required}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://erppreflight.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
      SMTP_TIMEOUT_MS: ${SMTP_TIMEOUT_MS:-20000}
      MAIL_HTTP_PROVIDER: ${MAIL_HTTP_PROVIDER:-resend}
      MAIL_HTTP_URL: ${MAIL_HTTP_URL:-}
      MAIL_HTTP_API_KEY: ${MAIL_HTTP_API_KEY:-}
      MAIL_DEV_OUTBOX_TOKEN: ${MAIL_DEV_OUTBOX_TOKEN:-}
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-true}
      KNOWLEDGE_SYNC_CRON: ${KNOWLEDGE_SYNC_CRON:-17 3 * * 1}
      KNOWLEDGE_CR_FILES: ${KNOWLEDGE_CR_FILES:-}
      # Platform governance: hourly knowledge-source freshness check ('off' disables)
      SOURCE_FRESHNESS_CRON: ${SOURCE_FRESHNESS_CRON:-41 * * * *}
      # Tenant access administration: support ticket e-mails to the operator inbox
      SUPPORT_INBOX_EMAIL: ${SUPPORT_INBOX_EMAIL:-}
      SUPPORT_INBOX_LOCALE: ${SUPPORT_INBOX_LOCALE:-en}
      # Client IP for IP allowlists / audit behind the Coolify reverse proxy (hop count)
      TRUST_PROXY: ${TRUST_PROXY:-1}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3001/health/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      erppreflight-net:
        aliases:
          - erppreflight-api
          - api
      coolify:
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      # HTTPS Router (Let's Encrypt TLS)
      - "traefik.http.routers.erppreflight-api.rule=Host(`api.erppreflight.com`)"
      - "traefik.http.routers.erppreflight-api.entrypoints=https"
      - "traefik.http.routers.erppreflight-api.tls=true"
      - "traefik.http.routers.erppreflight-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.erppreflight-api.service=erppreflight-api"
      # HTTP Router (Plain HTTP & ACME validation fallback)
      - "traefik.http.routers.erppreflight-api-http.rule=Host(`api.erppreflight.com`)"
      - "traefik.http.routers.erppreflight-api-http.entrypoints=http"
      - "traefik.http.routers.erppreflight-api-http.service=erppreflight-api"
      - "traefik.http.services.erppreflight-api.loadbalancer.server.port=3001"

  # ----------------------------------------------------------------------------
  # Next.js 15 Web Application (App Router, Base UI, TanStack Suite)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.erppreflight.com}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://erppreflight.com}
    container_name: erppreflight-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.erppreflight.com}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://erppreflight.com}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3001}
      NEXT_PUBLIC_LEGAL_COMPANY_NAME: ${NEXT_PUBLIC_LEGAL_COMPANY_NAME:-}
      NEXT_PUBLIC_LEGAL_ADDRESS: ${NEXT_PUBLIC_LEGAL_ADDRESS:-}
      NEXT_PUBLIC_LEGAL_REPRESENTATIVE: ${NEXT_PUBLIC_LEGAL_REPRESENTATIVE:-}
      NEXT_PUBLIC_LEGAL_REGISTER: ${NEXT_PUBLIC_LEGAL_REGISTER:-}
      NEXT_PUBLIC_LEGAL_VAT_ID: ${NEXT_PUBLIC_LEGAL_VAT_ID:-}
      NEXT_PUBLIC_LEGAL_EMAIL: ${NEXT_PUBLIC_LEGAL_EMAIL:-}
      NEXT_PUBLIC_LEGAL_PHONE: ${NEXT_PUBLIC_LEGAL_PHONE:-}
      NEXT_PUBLIC_LEGAL_RESPONSIBLE_PERSON: ${NEXT_PUBLIC_LEGAL_RESPONSIBLE_PERSON:-}
      NEXT_PUBLIC_LEGAL_SUBPROCESSORS: ${NEXT_PUBLIC_LEGAL_SUBPROCESSORS:-}
      NEXT_TELEMETRY_DISABLED: 1
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - erppreflight-net
      - coolify
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      # HTTPS Router (Let's Encrypt TLS)
      - "traefik.http.routers.erppreflight-web.rule=Host(`erppreflight.com`) || Host(`www.erppreflight.com`)"
      - "traefik.http.routers.erppreflight-web.entrypoints=https"
      - "traefik.http.routers.erppreflight-web.tls=true"
      - "traefik.http.routers.erppreflight-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.erppreflight-web.service=erppreflight-web"
      # HTTP Router (Plain HTTP & ACME validation fallback)
      - "traefik.http.routers.erppreflight-web-http.rule=Host(`erppreflight.com`) || Host(`www.erppreflight.com`) || Host(`b1jbemmdf9uioi0w2fdnnlb2.187.124.174.130.sslip.io`)"
      - "traefik.http.routers.erppreflight-web-http.entrypoints=http"
      - "traefik.http.routers.erppreflight-web-http.service=erppreflight-web"
      - "traefik.http.services.erppreflight-web.loadbalancer.server.port=3000"

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: erppreflight_postgres_data_v2
  redis_data:
    name: erppreflight_redis_data
  minio_data:
    name: erppreflight_minio_data
  clamav_db:
    name: erppreflight_clamav_db
  premigration_backups:
    name: erppreflight_premigration_backups

# ------------------------------------------------------------------------------
# Isolated Internal Docker Network & Coolify Proxy Ingress Network
# ------------------------------------------------------------------------------
networks:
  erppreflight-net:
    name: erppreflight-network
    driver: bridge
  coolify:
    external: true
