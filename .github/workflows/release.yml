name: Release — Tagged Images, Provenance, Signatures, SBOM & Changelog

# Spec 12.16 (tagged releases, changelog), 20.3 build provenance, 20.4 signed artifacts,
# 20.5 SBOM per release. Triggered by pushing a semver tag (git tag v1.2.3 && git push --tags).
#
# For every image (api, web, analysis) this workflow:
#   1. builds from the tagged commit and pushes to GHCR (ghcr.io/<owner>/<repo>/<image>);
#   2. attaches BuildKit SLSA provenance (mode=max) and an SBOM attestation to the image;
#   3. records a GitHub artifact attestation (actions/attest-build-provenance);
#   4. signs the pushed digest with cosign keyless signing (GitHub OIDC -> Sigstore Fulcio/Rekor);
#   5. re-scans the pushed image with Trivy (blocking) and exports a CycloneDX SBOM;
# then creates the GitHub Release with a changelog, image digests and SBOM files.
#
# Verify a release image before deploying it:
#   cosign verify ghcr.io/<owner>/<repo>/api@sha256:<digest> \
#     --certificate-identity-regexp 'https://github.com/<owner>/<repo>/.github/workflows/release.yml@refs/tags/v.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   gh attestation verify oci://ghcr.io/<owner>/<repo>/api@sha256:<digest> --repo <owner>/<repo>

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TRIVY_VERSION: v0.74.0
  REGISTRY: ghcr.io

jobs:
  images:
    name: ${{ matrix.name }} — build, push, attest, sign, scan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write        # push to GHCR
      id-token: write        # cosign keyless + attestations (OIDC)
      attestations: write    # actions/attest-build-provenance
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            dockerfile: infra/docker/Dockerfile.api
            build-args: ''
          - name: web
            dockerfile: infra/docker/Dockerfile.web
            # NEXT_PUBLIC_* is inlined at build time; set the repository variable
            # PUBLIC_API_URL (Settings -> Variables) for non-default domains.
            build-args: |
              NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL || 'https://api.erppreflight.com' }}
          - name: analysis
            dockerfile: infra/docker/Dockerfile.analysis
            build-args: ''
    outputs:
      digest-api: ${{ steps.out.outputs.digest-api }}
      digest-web: ${{ steps.out.outputs.digest-web }}
      digest-analysis: ${{ steps.out.outputs.digest-analysis }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image name (lower-case repository path)
        id: name
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Build and push (SLSA provenance + SBOM attestations)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}

      - name: GitHub artifact attestation (build provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image digest (cosign keyless)
        env:
          IMAGE: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign verify "$IMAGE" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null

      - name: Trivy scan of the pushed image (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'

      - name: CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: image
          image-ref: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: sbom-${{ matrix.name }}.cdx.json

      - name: Record digest
        id: out
        run: |
          echo "digest-${{ matrix.name }}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}" > digest-${{ matrix.name }}.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.name }}
          path: |
            sbom-${{ matrix.name }}.cdx.json
            digest-${{ matrix.name }}.txt
          retention-days: 90

  github-release:
    name: GitHub Release (changelog, digests, SBOMs)
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist-release
      - name: Changelog since the previous tag
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          RANGE=${PREV:+$PREV..}${GITHUB_REF_NAME}
          {
            echo "## Changes (${PREV:-initial} → ${GITHUB_REF_NAME})"
            echo
            git log --no-merges --pretty='- %s (%h)' "$RANGE"
            echo
            echo "## Images (sign-verified with cosign keyless, provenance attested)"
            echo
            echo '```'
            cat dist-release/digest-*.txt
            echo '```'
            echo
            echo "Commit: ${GITHUB_SHA}"
            echo
            echo "Deploy only by digest. Database migrations of this release: see packages/database/migrations"
            echo "and docs/runbooks/DISASTER_RECOVERY.md (take a backup with scripts/backup.sh first)."
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "ERP Preflight $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md --verify-tag $PRERELEASE dist-release/*
