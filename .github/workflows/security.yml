name: Security — Secrets, Vulnerabilities, IaC & Dependency Audit

# Spec 12.15 (Gitleaks, dependency audit, Trivy, SBOM), 10.18, 20.5–20.9.
# Blocking: gitleaks, Trivy fs (fixable HIGH/CRITICAL), Trivy config (Dockerfiles), pip-audit.
# Report-only: pnpm audit — the lockfile currently has open HIGH/CRITICAL advisories in dev/build
# tooling (vitest, orval>undici, next>postcss). They are tracked with owners in
# SECURITY_REVIEW.md §5; flip `continue-on-error` to false once that list is empty.
# Container image scans + SBOMs run in docker.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # Monday 04:00 UTC: catch newly published CVEs
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TRIVY_VERSION: v0.74.0

jobs:
  secret-scan:
    name: Gitleaks (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  trivy-fs:
    name: Trivy filesystem (lockfiles) + Dockerfile misconfiguration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Vulnerabilities in pnpm-lock.yaml / requirements (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          # Secrets are gitleaks' job (its allowlist covers the synthetic test secrets).
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'
      - name: Dockerfile / IaC misconfiguration (blocking on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: config
          scan-ref: infra/docker
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Repository SBOM (CycloneDX, lockfile level)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom-repository.cdx.json
          exit-code: '0'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-repository
          path: sbom-repository.cdx.json
          retention-days: 90

  pip-audit:
    name: Python dependency audit (blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r services/analysis-python/requirements.txt
          if [ -f services/analysis-python/requirements-dev.txt ]; then
            pip-audit -r services/analysis-python/requirements-dev.txt
          fi

  pnpm-audit:
    name: Node dependency audit (production blocking, full report-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: pnpm audit (production dependencies)
        run: pnpm audit --prod --audit-level high
      - name: pnpm audit (all dependencies, report-only — dev tooling residuals in SECURITY_REVIEW.md S7)
        if: always()
        continue-on-error: true
        run: pnpm audit --audit-level high
