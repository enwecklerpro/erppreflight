name: CI — Monorepo Build, Typecheck, Test & Compliance Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Facades & Dependency Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: No-Dependency-Soup Gate
        run: pnpm run check:deps

      - name: Production Facade & Security Gate
        run: pnpm run check:no-production-facades

      - name: Monorepo Strict Typecheck
        run: pnpm run typecheck

      - name: Monorepo Lint
        run: pnpm run lint

      - name: Monorepo Build
        run: pnpm run build

  test-node:
    name: TypeScript Unit & Integration Tests (NestJS, Web, Schemas)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript Tests
        run: pnpm run test

  test-python:
    name: Python Analysis Engines & Golden Fixtures (18 SAP Engines + MFS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/analysis-python/requirements.txt
          pip install pytest pytest-cov defusedxml

      - name: Run Pytest Golden Fixture Test Suite
        run: |
          pytest services/analysis-python/tests -v --durations=10
